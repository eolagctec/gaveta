<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrega — Gaveta (Mobile)</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#0ea5ff;--muted:#94a3b8;--btn-bg:#111827;--btn-border:#1f2a37;--success:#10b981}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#071226 0%, #071829 100%);color:#e6eef8}
    .app{width:100%;max-width:640px;margin:12px auto;background:rgba(4,10,18,0.6);border-radius:12px;padding:14px;box-shadow:0 6px 20px rgba(2,6,12,0.6)}
    .header{display:flex;gap:12px;align-items:center}
    .logo{width:56px;height:56px;border-radius:8px;background:#0b1220;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .logo img{width:100%;height:100%;object-fit:contain}
    .title{flex:1}
    .title h1{margin:0;font-size:1.05rem}
    .title p{margin:2px 0 0;color:var(--muted);font-size:0.85rem}
    .section{margin-top:12px}
    label.small{display:block;color:var(--muted);font-size:0.77rem;margin-bottom:6px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:var(--btn-bg);border:1px solid var(--btn-border);padding:10px 12px;border-radius:10px;color:#dbeafe;cursor:pointer;font-weight:600;min-width:64px;text-align:center}
    .chip.selected{background:linear-gradient(90deg,var(--accent),#60a5fa);color:#04263a;box-shadow:0 6px 18px rgba(14,165,255,0.12)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
    .btn{display:inline-block;padding:12px 14px;border-radius:10px;background:var(--accent);color:#04263a;font-weight:700;border:none;width:100%;text-align:center;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .footer{display:flex;gap:8px;margin-top:12px}
    .small-note{font-size:0.78rem;color:var(--muted);margin-top:8px}
    .loading{opacity:0.7;filter:grayscale(0.4);pointer-events:none}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#04263a;color:#dff7ff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(2,6,12,0.6);display:none}
    .toast.show{display:block}
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div class="logo" id="companyLogo"><img src="" alt="" style="display:none"></div>
      <div class="title">
        <h1 id="condoName">Condomínio</h1>
        <p id="subTitle">Selecione empresa, bloco e apartamento</p>
      </div>
      <div style="text-align:right">
        <div id="equipInfo" style="font-size:0.78rem;color:var(--muted)">Equip: —</div>
      </div>
    </div>

    <div class="section" id="companySection">
      <label class="small">Empresa de entrega</label>
      <div id="companiesRow" class="row"></div>
    </div>

    <div class="section">
      <label class="small">Blocos</label>
      <div id="blocksRow" class="row"></div>
    </div>

    <div class="section">
      <label class="small">Apartamentos</label>
      <div id="apartmentsGrid" class="grid"></div>
    </div>

    <div class="footer">
      <button class="btn ghost" id="btnScan">Recarregar</button>
      <button class="btn" id="btnConfirm">Confirmar entrega</button>
    </div>

    <div class="small-note" id="note">Use este app para registrar inserção do pacote no slot frontal e autorizar a gaveta.</div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  (function(){
    const apiBase = '/api.php';
    const app = document.getElementById('app');
    const companiesRow = document.getElementById('companiesRow');
    const blocksRow = document.getElementById('blocksRow');
    const apartmentsGrid = document.getElementById('apartmentsGrid');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnScan = document.getElementById('btnScan');
    const condoNameEl = document.getElementById('condoName');
    const companyLogoEl = document.querySelector('#companyLogo img');
    const equipInfo = document.getElementById('equipInfo');
    const toastEl = document.getElementById('toast');

    let state = { equipamento:null, condominio_id: parseInt(getQueryParam('condominio_id')||0), equipamento_id: parseInt(getQueryParam('equip_id')||0), companies:[], selectedCompany:null, apartments:[], blocks:[], selectedBlock:null, selectedApartment:null };

    function showToast(msg, time=3000){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=> toastEl.classList.remove('show'), time); }
    function setLoading(on){ if(on) app.classList.add('loading'); else app.classList.remove('loading'); }
    function getQueryParam(key){ const params = new URLSearchParams(window.location.search); return params.get(key); }

    async function fetchCompanies(){ try{ const res = await fetch(apiBase + '?action=listar_empresas', { credentials:'include' }); const data = await res.json(); state.companies = data.empresas || []; renderCompanies(); } catch(e){ console.error(e); showToast('Erro ao carregar empresas'); } }

    function renderCompanies(){ companiesRow.innerHTML = ''; state.companies.forEach(c=>{ const btn = document.createElement('div'); btn.className = 'chip'; btn.textContent = c.nome; btn.onclick = ()=>{ state.selectedCompany = c; Array.from(companiesRow.children).forEach(n=>n.classList.remove('selected')); btn.classList.add('selected'); if(c.logo_path){ companyLogoEl.src = '/' + c.logo_path; companyLogoEl.style.display = 'block'; } }; companiesRow.appendChild(btn); }); if(state.companies.length===1){ companiesRow.children[0].click(); } }

    async function scanEquipIfNeeded(){ if(state.equipamento_id){ setLoading(true); try{ const r = await fetch(apiBase + '?action=scan_equipamento', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ qr_hash: getQueryParam('qr') || '', equipamento_id: state.equipamento_id }) }); const j = await r.json(); if(j.equipamento){ state.equipamento = j.equipamento; state.condominio_id = j.equipamento.condominio_id || state.condominio_id; equipInfo.textContent = `Equip: ${j.equipamento.label || j.equipamento.id}`; condoNameEl.textContent = j.equipamento.condominio_nome || condoNameEl.textContent; } else { console.warn('scan response', j); } }catch(err){ console.warn(err); } setLoading(false); } }

    async function fetchApartments(){ if(!state.condominio_id){ showToast('condominio_id não informado (use ?condominio_id=)'); return; } setLoading(true); try{ const res = await fetch(apiBase + '?action=listar_moradores&condominio_id=' + state.condominio_id, { credentials:'include' }); const j = await res.json(); state.apartments = j.moradores || []; state.apartments = state.apartments.map(a=>({ id: a.id, numero: a.numero || a.numero_display || a.id, bloco: a.bloco || (a.bloco??''), raw: a })); const blocksSet = new Map(); state.apartments.forEach(a=>{ const b = (a.bloco||'').toString(); if(!blocksSet.has(b)) blocksSet.set(b, []); blocksSet.get(b).push(a); }); state.blocks = Array.from(blocksSet.keys()).filter(x=>x!=='').sort(); if(blocksSet.has('')) state.blocks.push(''); renderBlocks(); }catch(e){ console.error(e); showToast('Erro ao buscar apartamentos'); } setLoading(false); }

    function renderBlocks(){ blocksRow.innerHTML = ''; if(state.blocks.length===0){ const span = document.createElement('div'); span.className='chip'; span.textContent='(sem blocos)'; blocksRow.appendChild(span); renderApartments(state.apartments); return; } state.blocks.forEach(b=>{ const btn = document.createElement('div'); btn.className='chip'; btn.textContent = b || '-'; btn.onclick = ()=>{ state.selectedBlock = b; Array.from(blocksRow.children).forEach(n=>n.classList.remove('selected')); btn.classList.add('selected'); const aptList = state.apartments.filter(a => (a.bloco||'') === (b||'')); renderApartments(aptList); }; blocksRow.appendChild(btn); }); if(blocksRow.children.length>0){ blocksRow.children[0].click(); } }

    function renderApartments(list){ apartmentsGrid.innerHTML = ''; if(!list || list.length===0){ apartmentsGrid.innerHTML = '<div style="color:var(--muted);padding:12px">Nenhum apartamento</div>'; return; } list.forEach(a=>{ const b = document.createElement('button'); b.className = 'chip'; b.textContent = a.numero; b.onclick = ()=>{ state.selectedApartment = a; Array.from(apartmentsGrid.children).forEach(n=>n.classList.remove('selected')); b.classList.add('selected'); }; apartmentsGrid.appendChild(b); }); }

    async function confirmDelivery(){ if(!state.selectedCompany){ showToast('Selecione a empresa'); return; } if(!state.selectedApartment){ showToast('Selecione o apartamento'); return; } const payload = { equipamento_id: state.equipamento ? state.equipamento.id : (state.equipamento_id || null), condominio_id: state.condominio_id, empresa_id: state.selectedCompany.id, bloco: state.selectedApartment.bloco, numero: state.selectedApartment.numero, port: 'front' }; setLoading(true); try{ const r = await fetch(apiBase + '?action=authorize_open', { method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }); const j = await r.json(); if(j.open){ showToast('Autorizado — comando enviado ao equipamento', 4000); } else { showToast('Não autorizado: ' + (j.reason||'')); } }catch(e){ console.error(e); showToast('Erro ao requisitar autorização'); } setLoading(false); }

    btnConfirm.addEventListener('click', confirmDelivery);
    btnScan.addEventListener('click', ()=>{ fetchCompanies(); fetchApartments(); scanEquipIfNeeded(); });

    (async function init(){ setLoading(true); await fetchCompanies(); await fetchApartments(); await scanEquipIfNeeded(); setLoading(false); })();

  })();
  </script>
</body>
</html>
